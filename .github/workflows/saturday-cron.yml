name: Circle of Suck - Saturday sync

# During the season (August-December): every 15 minutes on Saturdays (UTC) and the early-Sunday
# UTC hours that cover West Coast kickoffs, plus one weekday-morning run for Thursday and Friday
# games. Each run pulls finals from CollegeFootballData.com, recomputes the circle, re-renders the
# post image, rebuilds the site into circle-of-suck/ and commits; the commit triggers the normal
# GitHub Pages build. That's at most about 680 API calls a month, inside CFBD's free tier of 1,000.
# Minutes are offset from :00, when GitHub's scheduler is busiest and most often delays runs.
on:
  schedule:
    - cron: '7-59/15 * * 8-12 6'
    - cron: '7-59/15 0-8 * 8-12 0'
    - cron: '17 13 * 8-12 1-5'
  push:
    branches: [main]
    paths: ['_circle-of-suck/**', '.github/workflows/saturday-cron.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: circle-of-suck-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: _circle-of-suck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _circle-of-suck/package-lock.json
      - run: npm ci
      - name: Fetch finals and recompute cycle, SCC and shortest paths
        run: npm run sync
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - name: Download team logos (first run only; kept afterwards)
        run: npm run logos
      - run: npm test
      - name: Render the post image and build into circle-of-suck/
        run: npm run publish
      - name: Commit data and build
        working-directory: .
        run: |
          git add _circle-of-suck/data _circle-of-suck/public circle-of-suck sec-parity-index
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Circle of Suck: sync $(date -u +%Y-%m-%dT%H:%MZ)"
          # main may have moved since checkout (a human push, or a run queued behind this one).
          git pull --rebase origin main
          git push
